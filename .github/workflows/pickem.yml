name: pickem

on:
  push:
    paths: ["pickem/**", ".github/workflows/pickem.yml"]
  pull_request:
    paths: ["pickem/**", ".github/workflows/pickem.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pickem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pickem/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
